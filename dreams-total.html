<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreams Total</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="main-container">
        <div class="content-wrapper">
            <h1>Dreams Summary</h1>
            <table id="dreamsTotal">
                <thead>
                    <tr>
                        <th>Dream Type</th>
                        <th>Total Count</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Good Dreams</td>
                        <td>8</td>  <!-- Intentional mismatch: actual count is 6 -->
                    </tr>
                    <tr>
                        <td>Bad Dreams</td>
                        <td>3</td>  <!-- Intentional mismatch: actual count is 4 -->
                    </tr>
                    <tr>
                        <td>Total Dreams</td>
                        <td>12</td>  <!-- Intentional mismatch: actual count is 10 -->
                    </tr>
                    <tr>
                        <td>Dreams This Week</td>
                        <td>7</td>  <!-- Another mismatch for testing -->
                    </tr>
                    <tr>
                        <td>Recurring Dreams</td>
                        <td>2</td>  <!-- Additional category for testing -->
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
